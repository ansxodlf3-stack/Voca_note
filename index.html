<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>VOCAB NOTE</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;color:#172033;font-family:Arial,sans-serif}
header{background:#172554;color:white;padding:22px}
h1{margin:0;font-size:24px}
header p{color:#cbd5e1;font-size:13px}
main{padding:14px;max-width:650px;margin:auto;padding-bottom:90px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:13px}
button{border:0;border-radius:10px;padding:12px;font-weight:bold;background:#2563eb;color:white;margin:4px 0}
input{padding:11px;border:1px solid #ddd;border-radius:9px;width:100%;margin:5px 0}
nav{position:fixed;bottom:0;background:white;width:100%;display:flex;padding:8px;border-top:1px solid #ddd}
nav button{flex:1;background:#eff6ff;color:#172554}
.page{display:none}
.page.active{display:block}
.word{background:white;padding:12px;border:1px solid #ddd;border-radius:12px;margin:10px 0}
.word strong{font-size:19px}
.muted{font-size:13px;color:#64748b;line-height:1.6}
#preview{width:100%;max-height:350px;object-fit:contain;margin-top:10px}
</style>
</head>

<body>
<header>
<h1>VOCAB NOTE</h1>
<p>파란 동그라미 영어 단어장</p>
</header>

<main>

<section id="home" class="page active">
<div class="card">
<h2>내 단어장</h2>
<h1 id="total">0</h1>
<p class="muted">저장된 영어 단어</p>
<button onclick="show('upload')">모의고사 사진 추가</button>
</div>
<div class="card">
<h3>사용 방법</h3>
<p class="muted">
모의고사 사진을 올리면 영어 단어를 읽고
파란색 동그라미 표시가 있는 단어를 찾아냅니다.
검정색 표시는 제외하도록 분석합니다.
</p>
</div>
</section>

<section id="upload" class="page">
<div class="card">
<h2>모의고사 사진 올리기</h2>
<input type="file" id="photo" accept="image/*">
<img id="preview">
<br>
<button onclick="scan()">파란 동그라미 단어 찾기</button>
<p id="status" class="muted"></p>
<div id="results"></div>
</div>
</section>

<section id="vocab" class="page">
<div class="card">
<h2>내 단어장</h2>
<div id="list"></div>
</div>
</section>

<section id="quiz" class="page">
<div class="card">
<h2>단어 시험</h2>
<div id="question"></div>
</div>
</section>

</main>

<nav>
<button onclick="show('home')">홈</button>
<button onclick="show('upload')">사진</button>
<button onclick="show('vocab')">단어장</button>
<button onclick="show('quiz')">시험</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
let words=JSON.parse(localStorage.getItem("vocabWords")||"[]");
let candidates=[];
let imageURL="";

function save(){
 localStorage.setItem("vocabWords",JSON.stringify(words));
 render();
}

function show(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 render();
 if(id==="quiz")quiz();
}

function escapeHTML(s){
 return String(s||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 document.getElementById("total").textContent=words.length;

 document.getElementById("list").innerHTML=words.map((w,i)=>`
 <div class="word">
 <strong>${escapeHTML(w.word)}</strong>
 <p>${escapeHTML(w.meaning||"뜻 미입력")}</p>
 <label><input type="checkbox" style="width:auto"
 ${w.known?"checked":""}
 onchange="words[${i}].known=this.checked;save()"> 암기 완료</label>
 <br>
 <button onclick="words.splice(${i},1);save()">삭제</button>
 </div>
 `).join("");
}

document.getElementById("photo").onchange=function(e){
 let f=e.target.files[0];
 if(!f)return;

 if(imageURL)URL.revokeObjectURL(imageURL);

 imageURL=URL.createObjectURL(f);
 document.getElementById("preview").src=imageURL;
 document.getElementById("status").textContent="사진 준비 완료";
};

function isBlue(r,g,b){
 return b>65 &&
 b>r*1.18 &&
 b>g*1.02 &&
 b-r>28;
}

/* 파란색 원형 표시와 단어 위치 비교 */
function findBlueWords(ctx,ocrWords){

 const canvas=ctx.canvas;
 const W=canvas.width;
 const H=canvas.height;
 const data=ctx.getImageData(0,0,W,H).data;

 function blueAt(x,y){
  x=Math.round(x);
  y=Math.round(y);

  if(x<0||y<0||x>=W||y>=H)return false;

  const i=(y*W+x)*4;

  return isBlue(data[i],data[i+1],data[i+2]);
 }

 function nearbyBlue(x,y){
  for(let dy=-2;dy<=2;dy++){
   for(let dx=-2;dx<=2;dx++){
    if(blueAt(x+dx,y+dy))return true;
   }
  }
  return false;
 }

 let found=[];

 for(const word of ocrWords){

  const b=word.bbox;

  const x=(b.x0+b.x1)/2;
  const y=(b.y0+b.y1)/2;

  const ww=b.x1-b.x0;
  const wh=b.y1-b.y0;

  if(ww<8||wh<5)continue;

  let best=0;

  for(const fx of [0.65,0.85,1.05,1.25,1.45]){
   for(const fy of [1.2,1.5,1.8,2.1,2.4]){

    const rx=ww*fx;
    const ry=wh*fy;

    let sectors=Array(12).fill(0);

    for(let i=0;i<144;i++){

     const a=2*Math.PI*i/144;
     const px=x+rx*Math.cos(a);
     const py=y+ry*Math.sin(a);

     if(nearbyBlue(px,py)){
      sectors[Math.floor(i/12)]++;
     }
    }

    const occupied=sectors.filter(v=>v>0).length;

    const top=sectors[0]+sectors[1]+sectors[2]>0;
    const bottom=sectors[6]+sectors[7]+sectors[8]>0;

    if(occupied>=4&&top&&bottom){
     best=Math.max(best,occupied/12);
    }
   }
  }

  if(best>0){
   found.push(word.text.trim());
  }
 }

 return [...new Set(found)];
}

async function scan(){

 if(!imageURL){
  alert("먼저 사진을 올려 주세요.");
  return;
 }

 if(!window.Tesseract){
  alert("OCR을 불러오지 못했어요. 인터넷을 확인해 주세요.");
  return;
 }

 const status=document.getElementById("status");
 const results=document.getElementById("results");

 results.innerHTML="";
 status.textContent="영어 단어를 읽는 중입니다. 잠시 기다려 주세요.";

 try{

  const im=new Image();
  im.src=imageURL;
  await im.decode();

  const scale=Math.min(1,1800/im.width);

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(im.width*scale);
  canvas.height=Math.round(im.height*scale);

  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(im,0,0,canvas.width,canvas.height);

  const worker=await Tesseract.createWorker("eng");

  const result=await worker.recognize(canvas);

  await worker.terminate();

  const ocrWords=(result.data.words||[]).filter(w=>
   /[a-zA-Z]{2,}/.test(w.text)
  );

  candidates=findBlueWords(ctx,ocrWords);

  status.textContent=
   "영어 글자 "+ocrWords.length+"개 인식 완료\n"+
   "파란색 동그라미 후보 "+candidates.length+"개 발견";

  showCandidates();

 }catch(e){

  status.textContent="오류가 발생했어요: "+e.message;

 }
}

async function translate(word){

 try{

  const url=
   "https://api.mymemory.translated.net/get?q="+
   encodeURIComponent(word)+
   "&langpair=en|ko";

  const response=await fetch(url);
  const data=await response.json();

  return data.responseData.translatedText||"";

 }catch(e){

  return "";

 }
}

async function showCandidates(){

 const box=document.getElementById("results");

 if(!candidates.length){

  box.innerHTML=`
  <p class="muted">
  자동으로 찾은 단어가 없습니다.
  아래에서 직접 단어를 추가할 수도 있어요.
  </p>
  `+manualForm();

  return;
 }

 box.innerHTML="<h3>찾은 단어 확인</h3>";

 for(let i=0;i<candidates.length;i++){

  const word=candidates[i];
  const meaning=await translate(word);

  const div=document.createElement("div");
  div.className="word";

  div.innerHTML=`
  <strong>${escapeHTML(word)}</strong>
  <input id="meaning${i}" value="${escapeHTML(meaning)}" placeholder="한국어 뜻">
  <button onclick="addWord(${i})">단어장에 저장</button>
  <button onclick="this.parentElement.remove()">제외</button>
  `;

  box.appendChild(div);
 }

 box.innerHTML+=manualForm();
}

function manualForm(){

 return `
 <hr>
 <h3>직접 단어 추가</h3>
 <input id="manualWord" placeholder="영어 단어">
 <input id="manualMeaning" placeholder="한국어 뜻">
 <button onclick="manualAdd()">직접 저장</button>
 `;
}

function addWord(i){

 const word=candidates[i];
 const meaning=document.getElementById("meaning"+i)?.value||"";

 if(words.some(w=>w.word.toLowerCase()===word.toLowerCase())){
  alert("이미 저장된 단어입니다.");
  return;
 }

 words.push({word,meaning,known:false});
 save();

 alert(word+" 저장 완료!");
}

function manualAdd(){

 const word=document.getElementById("manualWord").value.trim();
 const meaning=document.getElementById("manualMeaning").value.trim();

 if(!word)return alert("영어 단어를 입력해 주세요.");

 words.push({word,meaning,known:false});
 save();

 alert("저장 완료!");
}

let qi=0;

function quiz(){

 const box=document.getElementById("question");

 if(!words.length){
  box.textContent="먼저 단어를 추가해 주세요.";
  return;
 }

 if(qi>=words.length)qi=0;

 const w=words[qi];

 box.innerHTML=`
 <h1>${escapeHTML(w.word)}</h1>
 <button onclick="document.getElementById('answer').textContent='${escapeHTML(w.meaning)}'">
 뜻 확인
 </button>
 <p id="answer"></p>
 <button onclick="qi++;quiz()">다음 단어</button>
 `;
}

render();

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>

</body>
</html>
