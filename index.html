<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5267d8">
<title>나만의 영어 단어장</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6fc;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #4055bd;
}

.box {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 12px #00000010;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  background: #5267d8;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin: 4px 2px;
}

button:disabled {
  background: #aaa;
}

input[type="file"] {
  width: 100%;
  margin: 12px 0;
}

input[type="text"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  margin: 5px 0;
}

#preview {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
  display: none;
}

.word {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

.word strong {
  font-size: 19px;
  color: #4055bd;
}

.meaning {
  color: #555;
  margin: 7px 0;
}

.small {
  font-size: 13px;
  color: #888;
}

#status {
  white-space: pre-line;
  line-height: 1.6;
  color: #4055bd;
}

.flashcard {
  text-align: center;
  padding: 25px 10px;
}

.flashcard .english {
  font-size: 30px;
  font-weight: bold;
  color: #4055bd;
  margin: 20px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<div class="container">

<h1>📘 나만의 영어 단어장</h1>

<div class="box">
  <h3>📷 시험지 사진 올리기</h3>
  <p class="small">
    파란색 동그라미로 표시한 영어 단어를 찾아볼게요.
  </p>

  <input type="file" id="photo" accept="image/*">

  <img id="preview" alt="사진 미리보기">

  <button id="startButton" onclick="startOCR()" disabled>
    파란색 동그라미 단어 찾기
  </button>

  <div id="status"></div>
</div>

<div class="box">
  <h3>📝 찾은 단어</h3>
  <p class="small">
    단어와 뜻을 확인하고 틀린 부분은 직접 수정한 뒤 저장하세요.
  </p>
  <div id="results">아직 찾은 단어가 없습니다.</div>
</div>

<div class="box">
  <h3>📚 내 단어장</h3>
  <p id="count">저장된 단어 0개</p>
  <button onclick="showFlashcard()">단어 암기하기</button>
  <button onclick="exportWords()">단어장 내보내기</button>
  <div id="savedWords"></div>
</div>

<div class="box hidden" id="studyBox">
  <h3>🧠 단어 암기</h3>
  <div class="flashcard">
    <div id="cardNumber" class="small"></div>
    <div id="english" class="english"></div>
    <div id="korean"></div>
    <button onclick="showMeaning()">뜻 보기</button>
    <button onclick="nextCard()">다음 단어</button>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
let selectedImage = null;
let candidates = [];
let saved = JSON.parse(localStorage.getItem("myVocabulary") || "[]");
let cardIndex = 0;

// 사진 선택
document.getElementById("photo").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  selectedImage = file;

  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  document.getElementById("startButton").disabled = false;
  document.getElementById("status").textContent = "사진을 준비했어요.";
});

// 파란색인지 확인
function isBlue(r, g, b) {
  return (
    b > 65 &&
    b > r * 1.15 &&
    b > g * 1.03 &&
    b - r > 22
  );
}

// 특정 위치 주변에 파란색이 있는지 확인
function hasBlue(data, width, height, x, y) {
  x = Math.round(x);
  y = Math.round(y);

  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const px = x + dx;
      const py = y + dy;

      if (px < 0 || py < 0 || px >= width || py >= height) {
        continue;
      }

      const i = (py * width + px) * 4;

      if (isBlue(data[i], data[i + 1], data[i + 2])) {
        return true;
      }
    }
  }

  return false;
}

// 파란색 동그라미가 단어 주변에 있는지 확인
function findBlueWords(ctx, ocrWords) {
  const canvas = ctx.canvas;
  const width = canvas.width;
  const height = canvas.height;
  const data = ctx.getImageData(0, 0, width, height).data;

  const found = [];

  for (const word of ocrWords) {
    const text = word.text.trim();

    if (!/^[a-zA-Z][a-zA-Z'-]*$/.test(text)) continue;

    const b = word.bbox;

    const x = (b.x0 + b.x1) / 2;
    const y = (b.y0 + b.y1) / 2;
    const ww = b.x1 - b.x0;
    const wh = b.y1 - b.y0;

    if (ww < 8 || wh < 5) continue;

    let bestScore = 0;

    // 글자 주변의 여러 크기에서 동그라미 검사
    for (const fx of [0.8, 1.0, 1.2, 1.4, 1.6]) {
      for (const fy of [1.3, 1.6, 1.9, 2.2, 2.5]) {

        const rx = ww * fx;
        const ry = wh * fy;

        const sectors = Array(12).fill(0);

        for (let i = 0; i < 144; i++) {
          const angle = 2 * Math.PI * i / 144;

          const px = x + rx * Math.cos(angle);
          const py = y + ry * Math.sin(angle);

          if (hasBlue(data, width, height, px, py)) {
            sectors[Math.floor(i / 12)]++;
          }
        }

        const occupied = sectors.filter(v => v > 0).length;

        // 원의 위, 아래, 왼쪽, 오른쪽에 표시가 있는지 확인
        const top = sectors[0] + sectors[1] + sectors[11] > 0;
        const right = sectors[2] + sectors[3] + sectors[4] > 0;
        const bottom = sectors[5] + sectors[6] + sectors[7] > 0;
        const left = sectors[8] + sectors[9] + sectors[10] > 0;

        if (occupied >= 7 && top && right && bottom && left) {
          bestScore = Math.max(bestScore, occupied / 12);
        }
      }
    }

    if (bestScore >= 7 / 12) {
      found.push(text);
    }
  }

  return [...new Set(found)];
}

// 사진 글자 인식
async function startOCR() {
  if (!selectedImage) return;

  const button = document.getElementById("startButton");
  const status = document.getElementById("status");

  button.disabled = true;
  status.textContent = "사진을 읽고 있어요. 잠시 기다려 주세요.";

  try {
    const image = new Image();
    image.src = URL.createObjectURL(selectedImage);

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = reject;
    });

    const canvas = document.createElement("canvas");

    const scale = Math.min(1, 2200 / image.width);

    canvas.width = Math.round(image.width * scale);
    canvas.height = Math.round(image.height * scale);

    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

    status.textContent = "영어 글자를 인식하고 있어요...";

    const worker = await Tesseract.createWorker("eng");

    const result = await worker.recognize(canvas);

    await worker.terminate();

    const words = result.data.words.filter(w =>
      /^[a-zA-Z][a-zA-Z'-]*$/.test(w.text.trim())
    );

    status.textContent = "파란색 동그라미를 확인하고 있어요...";

    candidates = findBlueWords(ctx, words);

    if (candidates.length === 0) {
      status.textContent =
        "파란색 동그라미 단어를 찾지 못했어요.\n" +
        "사진이 선명한지, 동그라미가 파란색인지 확인해 주세요.\n" +
        "인식이 안 되면 단어를 직접 추가할 수도 있어요.";
    } else {
      status.textContent = candidates.length + "개 단어를 찾았어요!";
    }

    await showCandidates();

  } catch (error) {
    console.error(error);
    status.textContent =
      "사진을 읽는 중 문제가 생겼어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
  }

  button.disabled = false;
}

// 단어 뜻 번역
async function translate(word) {
  try {
    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(word) +
      "&langpair=en|ko";

    const response = await fetch(url);
    const data = await response.json();

    return data.responseData.translatedText || "";
  } catch (error) {
    return "";
  }
}

// 찾은 단어 화면에 표시
async function showCandidates() {
  const area = document.getElementById("results");
  area.innerHTML = "";

  if (candidates.length === 0) {
    area.innerHTML = "찾은 단어가 없습니다.";
    return;
  }

  for (const word of candidates) {
    const div = document.createElement("div");
    div.className = "word";

    div.innerHTML = `
      <strong></strong>
      <input type="text" placeholder="한국어 뜻">
      <button>단어장에 저장</button>
      <button>제외</button>
    `;

    div.querySelector("strong").textContent = word;

    const meaningInput = div.querySelector("input");
    const saveButton = div.querySelectorAll("button")[0];
    const removeButton = div.querySelectorAll("button")[1];

    saveButton.disabled = true;
    meaningInput.placeholder = "뜻을 가져오는 중...";

    translate(word).then(meaning => {
      meaningInput.value = meaning;
      meaningInput.placeholder = "한국어 뜻을 입력하세요";
      saveButton.disabled = false;
    });

    saveButton.onclick = () => {
      saveWord(word, meaningInput.value);
      div.remove();
    };

    removeButton.onclick = () => {
      div.remove();
    };

    area.appendChild(div);
  }
}

// 단어 저장
function saveWord(word, meaning) {
  const cleanWord = word.trim().toLowerCase();

  if (!cleanWord) return;

  const existing = saved.find(w => w.word === cleanWord);

  if (existing) {
    existing.meaning = meaning;
  } else {
    saved.push({
      word: cleanWord,
      meaning: meaning
    });
  }

  localStorage.setItem("myVocabulary", JSON.stringify(saved));

  renderSaved();
}

// 저장된 단어 표시
function renderSaved() {
  const area = document.getElementById("savedWords");

  document.getElementById("count").textContent =
    "저장된 단어 " + saved.length + "개";

  area.innerHTML = "";

  saved.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "word";

    const title = document.createElement("strong");
    title.textContent = item.word;

    const meaning = document.createElement("input");
    meaning.type = "text";
    meaning.value = item.meaning || "";
    meaning.placeholder = "뜻을 입력하세요";

    const saveButton = document.createElement("button");
    saveButton.textContent = "뜻 수정 저장";
    saveButton.onclick = () => {
      saved[index].meaning = meaning.value;
      localStorage.setItem("myVocabulary", JSON.stringify(saved));
      renderSaved();
    };

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "삭제";
    deleteButton.onclick = () => {
      saved.splice(index, 1);
      localStorage.setItem("myVocabulary", JSON.stringify(saved));
      renderSaved();
    };

    div.appendChild(title);
    div.appendChild(meaning);
    div.appendChild(saveButton);
    div.appendChild(deleteButton);

    area.appendChild(div);
  });
}

// 단어장 암기
function showFlashcard() {
  if (saved.length === 0) {
    alert("먼저 단어를 저장해 주세요.");
    return;
  }

  cardIndex = 0;

  document.getElementById("studyBox").classList.remove("hidden");

  showCard();

  document.getElementById("studyBox").scrollIntoView({
    behavior: "smooth"
  });
}

function showCard() {
  if (saved.length === 0) return;

  const item = saved[cardIndex];

  document.getElementById("cardNumber").textContent =
    (cardIndex + 1) + " / " + saved.length;

  document.getElementById("english").textContent = item.word;

  document.getElementById("korean").textContent = "";
}

function showMeaning() {
  if (saved.length === 0) return;

  document.getElementById("korean").textContent =
    saved[cardIndex].meaning || "뜻이 아직 없습니다.";
}

function nextCard() {
  if (saved.length === 0) return;

  cardIndex = (cardIndex + 1) % saved.length;
  showCard();
}

// 단어장 파일로 내보내기
function exportWords() {
  if (saved.length === 0) {
    alert("저장된 단어가 없습니다.");
    return;
  }

  const text = saved
    .map(item => item.word + " : " + item.meaning)
    .join("\n");

  const blob = new Blob(["\uFEFF" + text], {
    type: "text/plain;charset=utf-8"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "나의 영어 단어장.txt";
  link.click();

  URL.revokeObjectURL(link.href);
}

// 처음 화면 표시
renderSaved();
</script>

</body>
</html>
